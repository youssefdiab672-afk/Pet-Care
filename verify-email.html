<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare — Verify email</title><style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;margin:0}.card{background:white;padding:32px;border-radius:20px;max-width:520px;text-align:center;box-shadow:0 15px 40px #0001}a{display:inline-block;padding:12px 18px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none}</style><main class="card"><h1 id="title">Verifying…</h1><p id="msg">Please wait.</p><a href="/" id="home" style="display:none">Back to store</a></main><script>(async()=>{const t=new URLSearchParams(location.search).get('token');if(!t){title.textContent='Invalid link';msg.textContent='Verification token is missing.';home.style.display='inline-block';return}try{const r=await fetch('/api/auth/verify-email?token='+encodeURIComponent(t));const d=await r.json();if(!r.ok)throw Error(d.error||'Verification failed');title.textContent='Email verified';msg.textContent='Your account is verified. You can now sign in.'}catch(e){title.textContent='Verification failed';msg.textContent=e.message}home.style.display='inline-block'})()</script></html>
