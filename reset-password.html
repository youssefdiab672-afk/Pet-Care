<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare — Reset password</title><style>body{font-family:system-ui;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;margin:0}.card{background:white;padding:32px;border-radius:20px;max-width:440px;width:calc(100% - 40px);box-shadow:0 15px 40px #0001}input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #cbd5e1;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;cursor:pointer}</style><main class="card"><h1>Reset password</h1><input id="p" type="password" minlength="8" placeholder="New password"><button onclick="go()">Reset password</button><p id="m"></p></main><script>async function go(){const token=new URLSearchParams(location.search).get('token');try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p.value})});const d=await r.json();if(!r.ok)throw Error(d.error);m.textContent='Password reset successfully. You can sign in now.'}catch(e){m.textContent=e.message}}</script></html>
