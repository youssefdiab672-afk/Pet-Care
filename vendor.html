<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare Seller Studio</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f4f7fb;color:#0f172a}.top{background:#0b1220;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:30px 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700}.field input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;cursor:pointer}.btn.danger{background:#dc2626}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table td,.table th{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left}.tag{background:#eef2ff;color:#3730a3;border-radius:99px;padding:4px 9px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>PetCare / Seller Studio</b><div><button class="btn" onclick="location.href='/'">Store</button> <button class="btn danger" onclick="logout()">Logout</button></div></header><main class="wrap" id="app"><p>Loading...</p></main><script>
let token=localStorage.getItem('petcare_token')||'';const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token};const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('petcare_token');localStorage.removeItem('petcare_user');location.href='/'}async function load(){try{const d=await api('/api/vendor');$('app').innerHTML=`<h1>Seller dashboard</h1><p>Your products stay hidden from customers until the administrator approves them.</p><div class="grid"><div class="card"><h2>Payment settings</h2><p>Choose how customers should pay you for your products. Your payment details are shown on the customer's order page.</p><div class="field"><label>Payment method</label><select id="paymentMethod"><option value="wallet">Wallet</option><option value="bank">Bank account</option></select></div><div class="field"><label>Payment details</label><input id="paymentInstructions" placeholder="Wallet number or bank account details"></div><button class="btn" onclick="savePayment()">Save payment settings</button></div><div class="card"><h2>Submit a product</h2><div class="field"><label>English name</label><input id="name"></div><div class="field"><label>Arabic name</label><input id="nameAr"></div><div class="field"><label>Price (EGP)</label><input id="price" type="number"></div><div class="field"><label>Stock</label><input id="stock" type="number"></div><div class="field"><label>Emoji</label><input id="emoji" value="🐾"></div><button class="btn" onclick="add()">Submit for approval</button></div><div class="card"><h2>My products</h2><div class="table"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody>${d.products.length?d.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.price}</td><td>${p.stock}</td><td><span class="tag">${esc(p.status)}</span></td></tr>`).join(''):'<tr><td colspan="4">No products yet.</td></tr>'}</tbody></table></div></div></div><div class="card" style="margin-top:18px"><h2>Orders containing your products</h2><div class="table"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr></thead><tbody>${d.orders.length?d.orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer.name)}</td><td>${o.total} EGP</td><td>${esc(o.status)}</td></tr>`).join(''):'<tr><td colspan="4">No orders yet.</td></tr>'}</tbody></table></div></div>`;$('paymentMethod').value=d.settings.paymentMethod||'wallet';$('paymentInstructions').value=d.settings.paymentInstructions||''}catch(e){$('app').innerHTML='<div class="card">'+esc(e.message)+'</div>'}}async function savePayment(){try{await api('/api/vendor/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentMethod:$('paymentMethod').value,paymentInstructions:$('paymentInstructions').value})});alert('Payment settings saved.')}catch(e){alert(e.message)}}async function add(){try{await api('/api/vendor/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,nameAr:$('nameAr').value,price:$('price').value,stock:$('stock').value,emoji:$('emoji').value})});load()}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();
</script></body></html>
