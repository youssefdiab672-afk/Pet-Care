<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCare Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f3f6fb;color:#0f172a}.top{background:#0b1220;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1280px;margin:auto;padding:28px 20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.stat,.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;box-shadow:0 8px 25px #0f172a08}.stat b{font-size:25px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button,.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer}.tabs button{background:#e2e8f0}.tabs .on,.btn{background:#2563eb;color:#fff}.btn.danger{background:#dc2626}.btn.ok{background:#15803d}.btn.gray{background:#64748b}.section{display:none}.section.on{display:block}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb;vertical-align:top}.tag{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 9px;font-size:12px}.pending{background:#fff7ed;color:#c2410c}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.login{max-width:430px;margin:90px auto}.notice{padding:10px;background:#fef2f2;color:#b91c1c;border-radius:9px;display:none}.notice.on{display:block}.muted{color:#64748b}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>PetCare / Admin Console</b><button class="btn danger" onclick="logout()">Logout</button></header><main id="app" class="wrap"><div class="login card"><h2>Admin access</h2><p class="muted">Use the ADMIN_EMAIL and ADMIN_PASSWORD_HASH configured on the server.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn" style="width:100%" onclick="login()">Sign in</button><div id="notice" class="notice"></div></div></main><script>
let token=localStorage.getItem('petcare_token')||'',data=null;const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token};const r=await fetch(u,o);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}async function login(){try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error);if(d.user.role!=='admin')throw Error('This account is not an administrator');token=d.token;localStorage.setItem('petcare_token',token);render()}catch(e){$('notice').textContent=e.message;$('notice').classList.add('on')}}async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem('petcare_token');localStorage.removeItem('petcare_user');location.reload()}async function render(){try{data=await api('/api/admin')}catch{return}const pendingProducts=data.allProducts.filter(p=>p.status==='pending'),vendors=data.users.filter(u=>u.role==='vendor'),pendingVendors=vendors.filter(v=>v.vendor_status==='pending');$('app').innerHTML=`<div class="grid"><div class="stat">Live products<br><b>${Number(data.stats.products)}</b></div><div class="stat">Orders<br><b>${Number(data.stats.orders)}</b></div><div class="stat">Revenue<br><b>${Number(data.stats.revenue).toLocaleString()} EGP</b></div><div class="stat">Users / sellers<br><b>${Number(data.stats.users)} / ${Number(data.stats.vendors)}</b></div><div class="stat">Commission due<br><b>${Number(data.commissionsDue||0).toLocaleString()} EGP</b></div></div><div class="tabs"><button class="on" onclick="tab('overview',this)">Overview</button><button onclick="tab('products',this)">Products</button><button onclick="tab('vendors',this)">Sellers (${pendingVendors.length})</button><button onclick="tab('reviews',this)">Product review (${pendingProducts.length})</button><button onclick="tab('orders',this)">Orders</button><button onclick="tab('settings',this)">Settings</button></div><section id="overview" class="section on card"><h2>Production marketplace</h2><p>PostgreSQL is the source of truth. Products from sellers require approval. Commission is recorded per order and can only be marked paid after the real settlement is completed.</p><p class="muted">Payment provider: ${data.paymentsEnabled?'configured':'not configured'} · Health: <a href="/health" target="_blank">/health</a></p></section><section id="products" class="section"><div class="cols"><div class="card"><h2>Add platform product</h2>${formProduct('adminForm','Add product','createAdmin()')}</div><div class="card"><h2>Products</h2><div class="table"><table><thead><tr><th>ID</th><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.allProducts.map(p=>`<tr><td>${p.id}</td><td>${esc(p.emoji)} ${esc(p.name)}<br><small>${esc(p.vendorName)}</small></td><td>${p.price} EGP</td><td>${p.stock}</td><td><span class="tag ${p.status==='pending'?'pending':''}">${esc(p.status)}</span></td><td><button class="btn danger" onclick="del(${p.id})">Delete</button></td></tr>`).join('')}</tbody></table></div></div></div></section><section id="vendors" class="section card"><h2>Seller accounts</h2><div class="table"><table><thead><tr><th>Seller</th><th>Email</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.email)}</td><td><span class="tag">${esc(v.vendor_status||'')}</span></td><td>${new Date(v.created_at).toLocaleString()}</td><td>${v.vendor_status==='pending'?`<button class="btn ok" onclick="vendor(${v.id},'approved')">Approve</button> <button class="btn danger" onclick="vendor(${v.id},'rejected')">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div></section><section id="reviews" class="section card"><h2>Pending seller products</h2><div class="table"><table><thead><tr><th>Seller</th><th>Product</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody>${pendingProducts.length?pendingProducts.map(p=>`<tr><td>${esc(p.vendorName)}</td><td>${esc(p.name)}</td><td>${p.price}</td><td>${p.stock}</td><td><button class="btn ok" onclick="review(${p.id},'approved')">Approve</button> <button class="btn danger" onclick="review(${p.id},'rejected')">Reject</button></td></tr>`).join(''):'<tr><td colspan="5">No pending products.</td></tr>'}</tbody></table></div></section><section id="orders" class="section card"><h2>Orders</h2><div class="table"><table><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Commission</th><th>Status</th><th>Change</th></tr></thead><tbody>${data.recentOrders.map(o=>`<tr><td>#${o.id}<br><small>${new Date(o.createdAt).toLocaleString()}</small></td><td>${esc(o.customer.name)}<br>${esc(o.customer.email)}<br>${esc(o.customer.phone)}</td><td>${o.total} EGP</td><td>${esc(o.paymentMethod)}<br>${o.cashReference?`Ref: ${esc(o.cashReference)}`:''}</td><td>${Number(o.platformCommission||0).toLocaleString()} EGP<br><small>${esc(o.commissionStatus)}</small><br>${o.commissionStatus==='unsettled'?`<button class="btn ok" onclick="paid(${o.id})">Mark settled</button>`:''}</td><td>${esc(o.status)}</td><td><select onchange="status(${o.id},this.value)">${data.orderStatuses.map(s=>`<option ${s===o.status?'selected':''}>${esc(s)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></section><section id="settings" class="section card"><h2>Store & settlement settings</h2><div class="field"><label>Default transfer number</label><input id="cashPhone" value="${esc(data.cashPhone)}"></div><div class="field"><label>Commission destination type</label><select id="commissionDestinationType"><option value="wallet" ${data.commissionDestinationType==='wallet'?'selected':''}>Wallet</option><option value="bank" ${data.commissionDestinationType==='bank'?'selected':''}>Bank account</option></select></div><div class="field"><label>Commission destination</label><input id="commissionDestination" value="${esc(data.commissionDestination||'')}"></div><div class="field"><label>Default payment instructions</label><textarea id="defaultPaymentInstructions" rows="4">${esc(data.defaultPaymentInstructions||'')}</textarea></div><button class="btn" onclick="saveSettings()">Save settings</button><p class="muted">10% commission is calculated server-side. This screen does not claim money was transferred; use an approved settlement provider/process and then mark the ledger entry settled.</p></section>`}
function formProduct(id,label,fn){return `<div class="field"><label>English name</label><input id="${id}name"></div><div class="field"><label>Arabic name</label><input id="${id}nameAr"></div><div class="field"><label>Price (EGP)</label><input id="${id}price" type="number" min="0.01" step="0.01"></div><div class="field"><label>Stock</label><input id="${id}stock" type="number" min="0"></div><div class="field"><label>Emoji</label><input id="${id}emoji" value="🐾"></div><button class="btn" onclick="${fn}">${label}</button>`}
async function createAdmin(){try{await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('adminFormname').value,nameAr:$('adminFormnameAr').value,price:$('adminFormprice').value,stock:$('adminFormstock').value,emoji:$('adminFormemoji').value})});render()}catch(e){alert(e.message)}}async function vendor(id,status){try{await api('/api/admin/vendors/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}catch(e){alert(e.message)}}async function review(id,status){try{await api('/api/admin/products/'+id+'/review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}catch(e){alert(e.message)}}async function del(id){if(!confirm('Delete this product?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});render()}catch(e){alert(e.message)}}async function status(id,status){try{await api('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});render()}catch(e){alert(e.message)}}async function paid(id){if(!confirm('Only confirm after the real settlement has completed. Continue?'))return;try{await api('/api/admin/commissions/'+id+'/mark-paid',{method:'POST'});render()}catch(e){alert(e.message)}}async function saveSettings(){try{await api('/api/admin/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({cashPhone:$('cashPhone').value,commissionDestinationType:$('commissionDestinationType').value,commissionDestination:$('commissionDestination').value,defaultPaymentInstructions:$('defaultPaymentInstructions').value})});alert('Saved');render()}catch(e){alert(e.message)}}function tab(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');b.classList.add('on')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}if(token)render();
</script></body></html>
